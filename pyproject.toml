[project]
name = "ai-data-delivery-assurance-copilot"
version = "0.1.0"
description = "AI-powered Data Delivery Assurance Copilot for Data Engineering — from business requirements and DE-SDD to data mapping, data quality, reconciliation, validation and RCA."
readme = "README.md"
authors = [
    { name = "KRBhavaniSankar", email = "krbhavanisankar@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "streamlit>=1.40,<2",
    "pydantic>=2.8,<3",
    "requests>=2.32,<3",]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
[tool.pytest.ini_options]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
]